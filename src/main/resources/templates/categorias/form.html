
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categoria | BiblioTec</title>
    <link rel="stylesheet" th:href="@{/css/categorias.css}"
          href="../../static/static/categorias.css">
</head>
<body>
<h1 th:text="${categoria.id == null ? 'Nova categoria' : 'Editar categoria'}">
    Nova categoria
</h1>

<form class="formulario" th:action="@{/categorias}"
      th:object="${categoria}" method="post">
    <input type="hidden" th:field="*{id}">

    <label for="nome">Nome</label>
    <input type="text" th:field="*{nome}" th:errorclass="campo-erro">
    <p class="erro" th:if="${#fields.hasErrors('nome')}"
       th:errors="*{nome}">Erro no nome</p>

    <label for="descricao">Descrição</label>
    <input type="text" th:field="*{descricao}" th:errorclass="campo-erro">
    <p class="erro" th:if="${#fields.hasErrors('descricao')}"
       th:errors="*{descricao}">Erro na descrição</p>

    <div class="acoes">
        <button type="submit" class="botao">Salvar</button>
        <a class="botao botao-secundario"
           th:href="@{/categorias}">Cancelar</a>
    </div>
</form>
</body>
</html>
