
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Livro | BiblioTec</title>
</head>
<body>

<h1>Cadastro de Livro</h1>

<form th:action="@{/livros}" th:object="${livro}" method="post">

    <input type="hidden" th:field="*{id}">

    <label for="titulo">Título:</label>
    <input type="text" id="titulo" th:field="*{titulo}">
    <p th:if="${#fields.hasErrors('titulo')}"
       th:errors="*{titulo}">
        Erro no título
    </p>

    <label for="autor">Autor:</label>
    <input type="text" id="autor" th:field="*{autor}">
    <p th:if="${#fields.hasErrors('autor')}"
       th:errors="*{autor}">
        Erro no autor
    </p>

    <label for="isbn">ISBN:</label>
    <input type="text" id="isbn" th:field="*{isbn}">
    <p th:if="${#fields.hasErrors('isbn')}"
       th:errors="*{isbn}">
        Erro no ISBN
    </p>

    <label for="anoPublicacao">Ano de publicação:</label>
    <input type="number" id="anoPublicacao" th:field="*{anoPublicacao}">
    <p th:if="${#fields.hasErrors('anoPublicacao')}"
       th:errors="*{anoPublicacao}">
        Erro no ano
    </p>

    <label for="quantidadeTotal">Quantidade total:</label>
    <input type="number" id="quantidadeTotal" th:field="*{quantidadeTotal}">
    <p th:if="${#fields.hasErrors('quantidadeTotal')}"
       th:errors="*{quantidadeTotal}">
        Erro na quantidade
    </p>

    <label for="categoria">Categoria:</label>
    <select id="categoria" th:field="*{categoria.id}">
        <option value="">Selecione uma categoria</option>
        <option th:each="categoria : ${categorias}"
                th:value="${categoria.id}"
                th:text="${categoria.nome}">
        </option>
    </select>

    <p th:if="${#fields.hasErrors('categoria.id')}"
       th:errors="*{categoria.id}">
        Erro na categoria
    </p>

    <button type="submit" class="botao">Salvar</button>

    <a class="botao botao-secundario" th:href="@{/livros}">
        Cancelar
    </a>

</form>

</body>
</html>
